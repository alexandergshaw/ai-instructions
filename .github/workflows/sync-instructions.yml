name: Sync Claude Instructions

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from for manual testing
        required: true
        default: main
      version:
        description: Optional version label to publish
        required: false

concurrency:
  group: publish-claude-instructions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for release
        if: github.event_name == 'release'
        uses: actions/checkout@v4

      - name: Check out repository for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect enabled target repositories
        id: targets
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("config/targets.json", encoding="utf-8") as handle:
              data = json.load(handle)
          names = [
              t["repo"].split("/", 1)[1]
              for t in data.get("targets", [])
              if isinstance(t, dict) and isinstance(t.get("repo"), str) and t.get("enabled", True)
          ]
          # An empty list would scope the token to this repository alone, which is the safe
          # failure: publish.py then reports no enabled targets and exits cleanly.
          print("repositories=" + ",".join(names))
          PY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLAUDE_SYNC_APP_CLIENT_ID }}
          owner: ${{ vars.CLAUDE_SYNC_INSTALLATION_OWNER }}
          private-key: ${{ secrets.CLAUDE_SYNC_APP_PRIVATE_KEY }}
          # Scoped to the enabled targets rather than every repository this owner has.
          # Derived from config/targets.json so adding a target needs no second edit here.
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install --yes gh
          }

      - name: Determine source version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          elif [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            VERSION="manual-${SHORT_SHA}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ -z "$APP_SLUG" ]; then
            echo "App slug was not returned by actions/create-github-app-token@v3" >&2
            exit 1
          fi
          BOT_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Validate repository
        run: python scripts/validate.py

      - name: Publish payload to targets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_VERSION: ${{ steps.version.outputs.value }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: python scripts/publish.py
