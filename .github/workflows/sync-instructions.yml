name: Sync Claude Instructions

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from for manual testing
        required: true
        default: main
      version:
        description: Optional version label to publish
        required: false
      targets:
        description: >-
          Optional comma-separated repositories for this run. Blank sends to every enabled
          target. A name that is unknown, disabled or ambiguous fails the run before anything
          is cloned. Scoping only narrows.
        required: false

concurrency:
  group: publish-claude-instructions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for release
        if: github.event_name == 'release'
        uses: actions/checkout@v4

      - name: Check out repository for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve the repositories this run may reach
        id: targets
        env:
          REQUESTED_TARGETS: ${{ inputs.targets }}
        run: python scripts/select_targets.py >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLAUDE_SYNC_APP_CLIENT_ID }}
          owner: ${{ vars.CLAUDE_SYNC_INSTALLATION_OWNER }}
          private-key: ${{ secrets.CLAUDE_SYNC_APP_PRIVATE_KEY }}
          # Scoped to the repositories this run may reach, derived from config/targets.json by
          # scripts/select_targets.py -- the same filter publish.py uses, so the token can never
          # be wider than the run. That script refuses to emit an empty list: the action documents
          # that an empty `repositories` with `owner` set grants access to the whole installation.
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install --yes gh
          }

      - name: Determine source version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          elif [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            VERSION="manual-${SHORT_SHA}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ -z "$APP_SLUG" ]; then
            echo "App slug was not returned by actions/create-github-app-token@v3" >&2
            exit 1
          fi
          BOT_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Validate repository
        run: python scripts/validate.py

      - name: Publish payload to targets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUESTED_TARGETS: ${{ inputs.targets }}
          SOURCE_VERSION: ${{ steps.version.outputs.value }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: python scripts/publish.py
